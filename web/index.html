<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef3fa">
  <title>新闻资讯</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #eef3fa; color: #252a32; font: 14px/1.55 "Microsoft YaHei", "PingFang SC", sans-serif; }
    .phone { width: min(100%, 414px); min-height: 100vh; margin: 0 auto; background: #fff; box-shadow: 0 0 28px #1b31500b; }
    .header { position: sticky; z-index: 2; top: 0; background: #fff; }
    .title { height: 48px; display: grid; place-items: center; border-bottom: 1px solid #f1f1f1; font-size: 16px; font-weight: 700; }
    .tabs-wrap { position: relative; padding-right: 48px; background: #fff; }
    .tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { position: relative; flex: 0 0 auto; min-width: 49px; padding: 12px 10px 11px; border: 0; background: transparent; color: #85898f; cursor: pointer; font: inherit; }
    .tab.active { color: #3286d6; font-weight: 700; }
    .tab.active::after { position: absolute; right: 10px; bottom: 0; left: 10px; height: 3px; border-radius: 3px; background: #3286d6; content: ""; }
    .more { position: absolute; top: 0; right: 0; height: 43px; padding: 0 9px; border: 0; background: linear-gradient(90deg, #ffffffc9, #fff 25%); color: #3286d6; font: inherit; }
    .news-list { min-height: 220px; }
    .news-card { display: flex; gap: 12px; min-height: 112px; padding: 13px 15px; border-bottom: 1px solid #f0f0f0; color: inherit; text-decoration: none; cursor: pointer; }
    .news-card:hover { background: #f8fafc; }
    .news-card:focus-visible, .related-link:focus-visible { outline: 2px solid #3286d6; outline-offset: -2px; }
    .copy { display: flex; min-width: 0; flex: 1; flex-direction: column; }
    .news-title { display: -webkit-box; overflow: hidden; margin: 0; color: #262a30; font-size: 15px; font-weight: 700; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .news-desc { display: -webkit-box; overflow: hidden; margin-top: 5px; color: #777d85; font-size: 13px; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .meta { display: flex; gap: 14px; margin-top: auto; padding-top: 6px; color: #a0a4aa; font-size: 11px; }
    .thumb { position: relative; flex: 0 0 104px; width: 104px; height: 76px; overflow: hidden; align-self: center; border-radius: 4px; background: linear-gradient(140deg, #d9e7ef, #f4e8cf); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-placeholder { display: grid; width: 100%; height: 100%; place-items: center; color: #fff; font-size: 22px; font-weight: 700; background: linear-gradient(140deg, #84b9d5, #8fc8b2 55%, #e9c77d); }
    .state { padding: 58px 20px; color: #969ba3; text-align: center; }
    .state.error { color: #bf5555; }
    .load-more { display: block; width: 100%; padding: 16px; border: 0; background: #fff; color: #368bd3; cursor: pointer; font: inherit; }
    .load-more:disabled { color: #a5a9af; cursor: default; }
    .end { padding: 18px; color: #b0b4ba; text-align: center; font-size: 12px; }
    .detail-header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; height: 48px; border-bottom: 1px solid #f1f1f1; background: #fff; }
    .back { padding: 10px 15px; border: 0; background: transparent; color: #3286d6; font: inherit; cursor: pointer; }
    .detail-header strong { position: absolute; left: 50%; transform: translateX(-50%); font-size: 16px; }
    .detail-article { padding: 22px 18px; }
    .detail-title { margin: 0 0 12px; font-size: 23px; line-height: 1.5; overflow-wrap: anywhere; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 20px; color: #989fa8; font-size: 12px; }
    .detail-cover { overflow: hidden; margin-bottom: 20px; border-radius: 5px; }
    .detail-cover img { display: block; width: 100%; max-height: 320px; object-fit: cover; }
    .detail-body { font-size: 16px; line-height: 1.9; overflow-wrap: anywhere; }
    .detail-body p { margin: 0 0 18px; }
    .detail-body img { max-width: 100%; height: auto; }
    .detail-body a { color: #3286d6; }
    .detail-body blockquote { margin: 16px 0; padding: 10px 14px; border-left: 3px solid #3286d6; background: #f6f8fb; }
    .related { margin-top: 28px; border-top: 1px solid #eceff3; }
    .related h2 { margin: 18px 0 6px; font-size: 17px; }
    .related-link { display: block; padding: 12px 0; border-bottom: 1px solid #f0f0f0; color: inherit; text-decoration: none; }
    .related-link small { display: block; margin-top: 5px; color: #a0a4aa; }
    @media (min-width: 700px) { .phone { margin: 22px auto; min-height: calc(100vh - 44px); border-radius: 5px; overflow: hidden; } }
  </style>
</head>
<body>
  <main class="phone">
    <div id="home-view">
    <header class="header">
      <div class="title">新闻资讯</div>
      <div class="tabs-wrap">
        <nav id="tabs" class="tabs" aria-label="新闻分类">
          <button class="tab active" data-id="0" type="button">头条</button>
        </nav>
        <button class="more" type="button" aria-label="查看更多分类">更多 ›</button>
      </div>
    </header>
    <section id="news-list" class="news-list" aria-live="polite">
      <div class="state">正在加载新闻…</div>
    </section>
    <button id="load-more" class="load-more" type="button" hidden>加载更多</button>
    </div>
    <section id="detail-view" hidden aria-label="新闻详情">
      <header class="detail-header"><button id="back" class="back" type="button">‹ 返回</button><strong>新闻详情</strong></header>
      <div id="detail-content" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const tabs = document.querySelector('#tabs');
    const list = document.querySelector('#news-list');
    const loadMoreButton = document.querySelector('#load-more');
    const homeView = document.querySelector('#home-view');
    const detailView = document.querySelector('#detail-view');
    const detailContent = document.querySelector('#detail-content');
    let detailController = null;
    let homeScrollPosition = 0;
    const pageSize = 20;
    let selectedCategory = 0;
    let page = 1;
    let hasMore = false;
    let loading = false;
    let newsItems = [];

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    function imageMarkup(value) {
      const url = String(value ?? '').trim();
      if (!url || !/^(https?:\/\/|\/|\.\/)/i.test(url)) {
        return '<div class="thumb-placeholder">头条</div>';
      }
      return `<img src="${escapeHtml(url)}" alt="新闻配图" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'thumb-placeholder', textContent:'头条'}))">`;
    }

    function renderNews() {
      if (!newsItems.length) {
        list.innerHTML = '<div class="state">当前分类暂时没有新闻</div>';
        loadMoreButton.hidden = true;
        return;
      }
      list.innerHTML = newsItems.map(item => `
        <a class="news-card" href="#news/${Number(item.id)}">
          <div class="copy">
            <h2 class="news-title">${escapeHtml(item.title || '未命名新闻')}</h2>
            ${item.description ? `<div class="news-desc">${escapeHtml(item.description)}</div>` : ''}
            <div class="meta"><span>${escapeHtml(item.author || '新闻资讯')}</span><span>${escapeHtml(item.views ?? 0)} 阅读</span></div>
          </div>
          <div class="thumb">${imageMarkup(item.image)}</div>
        </a>`).join('');
      loadMoreButton.hidden = !hasMore;
      loadMoreButton.disabled = loading;
      loadMoreButton.textContent = loading ? '正在加载…' : '加载更多';
    }

    async function loadNews(reset = false) {
      if (loading) return;
      if (reset) {
        page = 1;
        hasMore = false;
        newsItems = [];
        list.innerHTML = '<div class="state">正在加载新闻…</div>';
      }
      loading = true;
      loadMoreButton.disabled = true;
      try {
        const params = new URLSearchParams({ categoryid: String(selectedCategory), page: String(page), pagesize: String(pageSize) });
        const response = await fetch(`/api/news/list?${params}`, { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`新闻接口返回 ${response.status}`);
        const result = await response.json();
        const data = result.data;
        if (!data || !Array.isArray(data.list)) throw new Error(result.message || '新闻数据格式不正确');
        newsItems = reset ? data.list : newsItems.concat(data.list);
        hasMore = Boolean(data.hasmore);
        if (data.list.length) page += 1;
        renderNews();
      } catch (error) {
        if (reset || !newsItems.length) {
          list.innerHTML = `<div class="state error">新闻加载失败：${escapeHtml(error.message)}<br>请检查后端接口和数据库。</div>`;
        } else {
          loadMoreButton.textContent = '加载失败，点击重试';
        }
        loadMoreButton.hidden = false;
      } finally {
        loading = false;
        loadMoreButton.disabled = false;
        if (loadMoreButton.textContent === '正在加载…') loadMoreButton.textContent = '加载更多';
      }
    }

    async function loadCategories() {
      try {
        const response = await fetch('/api/news/categories', { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`分类接口返回 ${response.status}`);
        const result = await response.json();
        if (!Array.isArray(result.data)) throw new Error('分类数据格式不正确');
        const categories = result.data.filter(item => item.name !== '头条');
        tabs.innerHTML = '<button class="tab active" data-id="0" type="button">头条</button>' + categories.map(item =>
          `<button class="tab" data-id="${Number(item.id)}" type="button">${escapeHtml(item.name)}</button>`
        ).join('');
      } catch (_) {
        // 新闻列表仍可用“头条”查看全部文章。
      }
    }

    function articleContent(value) {
      const content = String(value ?? '');
      if (!content.trim()) return '<p>暂无正文内容。</p>';
      if (!/<[a-z][\s\S]*>/i.test(content)) {
        return content.split(/\n+/).filter(line => line.trim()).map(line => `<p>${escapeHtml(line)}</p>`).join('');
      }
      // 保留常见正文格式，移除脚本、事件属性和不安全的链接。
      const template = document.createElement('template');
      template.innerHTML = content;
      const allowed = new Set(['p', 'br', 'strong', 'b', 'em', 'i', 'h2', 'h3', 'h4', 'ul', 'ol', 'li', 'blockquote', 'a', 'img']);
      function clean(node) {
        if (node.nodeType === Node.TEXT_NODE) return escapeHtml(node.textContent);
        if (node.nodeType !== Node.ELEMENT_NODE) return '';
        const tag = node.tagName.toLowerCase();
        if (['script', 'style', 'iframe', 'object', 'embed', 'svg', 'math'].includes(tag)) return '';
        const children = Array.from(node.childNodes).map(clean).join('');
        if (!allowed.has(tag)) return children;
        if (tag === 'img') {
          const src = node.getAttribute('src') || '';
          return /^(https?:\/\/|\/|\.\/)/i.test(src) ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(node.getAttribute('alt') || '正文配图')}" loading="lazy">` : '';
        }
        if (tag === 'a') {
          const href = node.getAttribute('href') || '';
          return /^(https?:\/\/|\/|\.\/|#)/i.test(href) ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${children}</a>` : children;
        }
        return tag === 'br' ? '<br>' : `<${tag}>${children}</${tag}>`;
      }
      return Array.from(template.content.childNodes).map(clean).join('');
    }

    function formatPublishTime(value) {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN', { hour12: false });
    }

    async function loadDetail(newsId) {
      if (detailController) detailController.abort();
      const controller = new AbortController();
      detailController = controller;
      detailContent.innerHTML = '<div class="state">正在加载新闻详情…</div>';
      document.title = '新闻详情';
      try {
        const response = await fetch(`/api/news/detail?newsId=${newsId}`, { headers: { Accept: 'application/json' }, signal: controller.signal });
        if (!response.ok) throw new Error(response.status === 404 ? '这条新闻不存在或已被删除' : `详情加载失败（${response.status}）`);
        const result = await response.json();
        const article = result.data;
        if (!article || !article.id) throw new Error('新闻详情数据不完整');
        if (controller.signal.aborted) return;
        const related = Array.isArray(article.relatedNews) ? article.relatedNews : [];
        detailContent.innerHTML = `
          <article class="detail-article">
            <h1 class="detail-title">${escapeHtml(article.title)}</h1>
            <div class="detail-meta"><span>${escapeHtml(article.author || '新闻资讯')}</span><time>${escapeHtml(formatPublishTime(article.publishTime))}</time><span>${escapeHtml(article.views ?? 0)} 阅读</span></div>
            ${article.image ? `<div class="detail-cover">${imageMarkup(article.image)}</div>` : ''}
            <div class="detail-body">${articleContent(article.content)}</div>
            ${related.length ? `<section class="related"><h2>相关推荐</h2>${related.map(item => `<a class="related-link" href="#news/${Number(item.id)}">${escapeHtml(item.title)}<small>${escapeHtml(item.author || '新闻资讯')} · ${escapeHtml(item.views ?? 0)} 阅读</small></a>`).join('')}</section>` : ''}
          </article>`;
        document.title = `${article.title} - 新闻资讯`;
        const cached = newsItems.find(item => Number(item.id) === Number(article.id));
        if (cached) { cached.views = article.views; renderNews(); }
      } catch (error) {
        if (error.name === 'AbortError') return;
        detailContent.innerHTML = `<div class="state error">${escapeHtml(error.message)}<br><button id="retry-detail" class="back" type="button">重新加载</button></div>`;
      }
    }

    function showRoute() {
      const match = location.hash.match(/^#news\/([1-9]\d*)$/);
      if (match) {
        if (!homeView.hidden) homeScrollPosition = window.scrollY;
        homeView.hidden = true;
        detailView.hidden = false;
        window.scrollTo(0, 0);
        loadDetail(Number(match[1]));
      } else {
        if (detailController) detailController.abort();
        homeView.hidden = false;
        detailView.hidden = true;
        document.title = '新闻资讯';
        requestAnimationFrame(() => window.scrollTo(0, homeScrollPosition));
      }
    }

    window.addEventListener('hashchange', showRoute);
    document.querySelector('#back').addEventListener('click', () => {
      history.replaceState(null, '', location.pathname + location.search);
      showRoute();
    });
    detailContent.addEventListener('click', event => {
      if (event.target.closest('#retry-detail')) showRoute();
    });

    tabs.addEventListener('click', event => {
      const tab = event.target.closest('.tab');
      if (!tab || loading) return;
      selectedCategory = Number(tab.dataset.id) || 0;
      tabs.querySelectorAll('.tab').forEach(item => item.classList.toggle('active', item === tab));
      loadNews(true);
    });
    document.querySelector('.more').addEventListener('click', () => {
      tabs.scrollBy({ left: 220, behavior: 'smooth' });
    });
    loadMoreButton.addEventListener('click', () => loadNews(false));
    loadCategories();
    loadNews(true);
    showRoute();
  </script>
</body>
</html>
